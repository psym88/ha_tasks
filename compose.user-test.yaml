name: ha-tasks-user-test

services:
  prepare:
    image: alpine:3.22
    volumes:
      - .:/workspace:ro
      - user-test-config:/config
    command: >-
      sh -ec "mkdir -p /config/custom_components &&
      rm -rf /config/custom_components/tasks &&
      cp -R /workspace/custom_components/tasks /config/custom_components/tasks &&
      if [ ! -f /config/configuration.yaml ]; then
        cp /workspace/tests/runtime/configuration.yaml /config/configuration.yaml;
      fi"

  runtime:
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-2026.8.0}
    container_name: ha-tasks-user-test
    restart: unless-stopped
    environment:
      TZ: Europe/Zurich
    ports:
      - "8122:8123"
    volumes:
      - user-test-config:/config

volumes:
  user-test-config:
    name: ha-tasks-user-test-config
