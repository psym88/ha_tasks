name: Start user test environment

env:
  HA_TASKS_FORGEJO_CI: "1"

on:
  workflow_dispatch:

concurrency:
  group: ha-tasks-user-test-control
  cancel-in-progress: false

jobs:
  start:
    name: Start Home Assistant on port 8122
    runs-on: ubuntu-latest
    container: ghcr.io/catthehacker/ubuntu:act-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Prepare shared container workspace
        run: bash scripts/forgejo-workspace.sh prepare
      - name: Start or update user test environment
        run: bash scripts/user-test-environment.sh start
      - name: Show environment status
        run: bash scripts/user-test-environment.sh status
