name: Start user test environment

on:
  workflow_dispatch:

concurrency:
  group: ha-tasks-user-test-control
  cancel-in-progress: false

jobs:
  start:
    name: Start Home Assistant on port 8122
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Start or update user test environment
        run: scripts/user-test-environment.sh start
      - name: Show environment status
        run: scripts/user-test-environment.sh status
