name: Hassfest

env:
  HA_TASKS_FORGEJO_CI: "1"

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate integration
    runs-on: ubuntu-latest
    container: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Prepare shared container workspace
        run: bash scripts/forgejo-workspace.sh prepare
      - name: Run Hassfest
        run: >-
          docker run --rm
          --volume ha-tasks-forgejo-workspace:/github/workspace
          ghcr.io/home-assistant/hassfest:latest
