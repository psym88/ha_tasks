name: Stop user test environment

on:
  workflow_dispatch:

concurrency:
  group: ha-tasks-user-test-control
  cancel-in-progress: false

jobs:
  stop:
    name: Stop Home Assistant on port 8122
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Stop user test environment
        run: scripts/user-test-environment.sh stop
      - name: Upload Home Assistant log
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: user-test-log
          path: .artifacts/user-test
          retention-days: 14
          if-no-files-found: warn
