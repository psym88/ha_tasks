name: Documentation screenshots

on:
  workflow_dispatch:

concurrency:
  group: ha-tasks-local-ci
  cancel-in-progress: false

jobs:
  screenshots:
    name: Capture and compare screenshots
    runs-on: ubuntu-latest
    container: ghcr.io/catthehacker/ubuntu:act-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Run runtime and visual validation
        run: bash scripts/test-runtime.sh
      - name: Upload screenshots and visual differences
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: .artifacts/runtime
          retention-days: 14
          if-no-files-found: warn
