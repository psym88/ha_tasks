name: HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    name: Validate local HACS metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Validate local HACS metadata
        run: node scripts/validate-hacs-metadata.mjs
