name: Tests
run-name: Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ha_version:
        description: Home Assistant image tag used by backend and runtime tests
        required: false
        type: string
        default: "2026.8.0"
      compare_screenshots:
        description: Compare generated screenshots with documentation baselines
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HA_VERSION: ${{ inputs.ha_version || '2026.8.0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run backend validation
        run: bash scripts/test-backend.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run frontend validation
        run: bash scripts/test-frontend.sh

  runtime:
    name: Home Assistant runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HA_VERSION: ${{ inputs.ha_version || '2026.8.0' }}
      HA_TASKS_COMPARE_SCREENSHOTS: ${{ (inputs.compare_screenshots || (github.event_name == 'pull_request' && github.base_ref == 'main')) && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run runtime validation
        run: bash scripts/test-runtime.sh
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation
          path: .artifacts/runtime
          retention-days: 14
          if-no-files-found: warn

  hassfest:
    name: Validate integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
