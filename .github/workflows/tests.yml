name: Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run backend validation
        run: bash scripts/test-backend.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run frontend validation
        run: bash scripts/test-frontend.sh

  runtime:
    name: Home Assistant runtime and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run runtime and visual validation
        run: bash scripts/test-runtime.sh
      - name: Upload runtime logs and screenshot differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation
          path: .artifacts/runtime
          retention-days: 14
          if-no-files-found: warn
