name: Beta Tests
run-name: Beta Tests

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-tests
  cancel-in-progress: false

jobs:
  beta-image:
    name: Check Home Assistant beta image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cached: ${{ steps.cache.outputs.cache-hit }}
      digest: ${{ steps.image.outputs.digest }}
      digest_id: ${{ steps.image.outputs.digest_id }}
      should_run: ${{ github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true' }}
    steps:
      - name: Resolve beta image digest
        id: image
        run: |
          digest="$(docker buildx imagetools inspect ghcr.io/home-assistant/home-assistant:beta --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest_id=${digest#sha256:}" >> "$GITHUB_OUTPUT"
      - name: Check successful beta digest cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ha-beta-tested
          key: ha-beta-${{ steps.image.outputs.digest_id }}

  tests:
    name: Run shared test suite
    needs: beta-image
    if: needs.beta-image.outputs.should_run == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      ha_version: beta
      compare_screenshots: true

  beta-failure-issue:
    name: Report beta compatibility failure
    needs:
      - beta-image
      - tests
    if: >-
      always() &&
      needs.beta-image.outputs.should_run == 'true' &&
      needs.tests.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update beta failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_DIGEST: ${{ needs.beta-image.outputs.digest }}
          BETA_DIGEST_ID: ${{ needs.beta-image.outputs.digest_id }}
        run: |
          gh label create beta-compatibility \
            --repo "$GITHUB_REPOSITORY" \
            --color d73a4a \
            --description "Home Assistant beta compatibility failures" \
            --force
          short_digest="${BETA_DIGEST_ID:0:12}"
          title="Beta compatibility failure: $short_digest"
          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --label beta-compatibility \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Beta Tests failed again for digest \`$BETA_DIGEST\`: $run_url"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --label beta-compatibility \
              --title "$title" \
              --body "Beta Tests failed for Home Assistant \`beta\` digest \`$BETA_DIGEST\`.

          Workflow run: $run_url
          Commit: \`$GITHUB_SHA\`

          This issue will close automatically after a newer beta image passes the complete shared test suite."
          fi

  beta-success:
    name: Record successful beta image
    needs:
      - beta-image
      - tests
    if: >-
      always() &&
      needs.beta-image.outputs.should_run == 'true' &&
      needs.tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Close failures from older beta images
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_DIGEST: ${{ needs.beta-image.outputs.digest }}
          BETA_DIGEST_ID: ${{ needs.beta-image.outputs.digest_id }}
        run: |
          gh label create beta-compatibility \
            --repo "$GITHUB_REPOSITORY" \
            --color d73a4a \
            --description "Home Assistant beta compatibility failures" \
            --force
          current_title="Beta compatibility failure: ${BETA_DIGEST_ID:0:12}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label beta-compatibility \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title != \"$current_title\") | .number" |
          while read -r issue; do
            [ -z "$issue" ] && continue
            gh issue close "$issue" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed \
              --comment "A newer Home Assistant beta image (\`$BETA_DIGEST\`) passed the complete shared test suite: $run_url"
          done
      - name: Prepare successful beta digest marker
        if: needs.beta-image.outputs.cached != 'true'
        run: |
          mkdir -p .cache/ha-beta-tested
          printf '%s\n' '${{ needs.beta-image.outputs.digest }}' > .cache/ha-beta-tested/digest
      - name: Cache successful beta digest
        if: needs.beta-image.outputs.cached != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/ha-beta-tested
          key: ha-beta-${{ needs.beta-image.outputs.digest_id }}
