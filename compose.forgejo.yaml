services:
  backend:
    volumes: !override
      - forgejo-workspace:/workspace
      - pytest-cache:/workspace/.pytest_cache

  frontend:
    volumes: !override
      - forgejo-workspace:/workspace
      - pnpm-store:/pnpm/store

  runtime:
    volumes: !override
      - runtime-config:/config

  e2e:
    volumes: !override
      - forgejo-workspace:/workspace
      - pnpm-store:/pnpm/store

  verify-runtime:
    volumes: !override
      - forgejo-workspace:/workspace

  compare-screenshots:
    volumes: !override
      - forgejo-workspace:/workspace
      - pnpm-store:/pnpm/store

volumes:
  forgejo-workspace:
    name: ha-tasks-forgejo-workspace
    external: true
